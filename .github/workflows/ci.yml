name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: digital_shop_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/digital_shop_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run migrate

      # Параллельность файлов ограничена внутри scripts/run-tests.ts, а не здесь.
      # Каждый файл создаёт свою базу, свой пул приложения и пул для двух
      # заглушек, и все они приходят на один сервер со стандартным
      # max_connections = 100. Без ограничения CREATE DATABASE выстраивается в
      # очередь и упирается в statement_timeout, а голодающий пул заставляет
      # заглушку отвечать медленно — и сценарий про чистый отказ незаметно
      # превращается в сценарий про таймаут. Переопределяется через
      # TEST_CONCURRENCY, если у раннера база просторнее.
      - run: npm test
